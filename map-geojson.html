<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaflet Examples</title>

<!-- Bootstrap core CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.6.0/dist/leaflet.css" integrity="sha512-xwE/Az9zrjBIphAcBb3F6JVqxf46+CDLwfLMHloNu6KEQCAWi6HcDUbeOfBIptF7tcCzusKFjFw2yuvEpDL9wQ==" crossorigin="" />

<style>
  #map { height: 380px; }
  .popup-chart {
    font-family: Arial, sans-serif;
    width: 230px;
  }
  .popup-chart h6 {
    margin: 0;
    font-weight: bold;
  }
  .popup-chart p {
    margin: 0;
    color: #555;
  }
  .popup-chart .value {
    margin-top: 4px;
    font-size: 18px;
    font-weight: bold;
    color: #1a936f;
  }
  .popup-chart .subtitle {
    font-size: 11px;
    color: #777;
  }
</style>
</head>

<body>
<nav class="navbar navbar-expand-sm navbar-dark bg-dark" aria-label="Third navbar example">
  <div class="container-fluid">
    <a href="#" class="navbar-brand d-flex align-items-center">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor"
        stroke-linecap="round" stroke-linejoin="round" stroke-width="2" class="me-2" viewBox="0 0 24 24">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
        <circle cx="12" cy="13" r="4" />
      </svg>
      <strong>Leaflet Examples</strong>
    </a>
  </div>
</nav>

<main>
  <section class="py-5 container">
    <h1 class="fw-light text-center">Peta Deforestasi Lahan Tambang</h1>
    <div class="row py-lg-5">
      <div id="map"></div>
    </div>
  </section>
</main>

<footer class="text-muted py-5">
  <div class="container">
    <p class="float-end mb-1"><a href="#">Back to top</a></p>
  </div>
</footer>

<!-- Bootstrap + Leaflet JS -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1/dist/js/bootstrap.min.js"></script>
<script src="https://unpkg.com/leaflet@1.6.0/dist/leaflet.js"></script>

<script>
  // --- Map tile sources ---
  var mapbox_url = 'https://api.mapbox.com/styles/v1/{id}/tiles/{z}/{x}/{y}?access_token=pk.eyJ1Ijoiam9ubnltY2N1bGxhZ2giLCJhIjoiY2xsYzdveWh4MGhwcjN0cXV5Z3BwMXA1dCJ9.QoEHzPNq9DtTRrdtXfOdrw';
  var esri_url = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
  var mapbox_attribution = '© Mapbox © OpenStreetMap Contributors';
  var esri_attribution = '© Esri © OpenStreetMap Contributors';

  var lyr_satellite = L.tileLayer(esri_url, {
    id: 'MapID', maxZoom: 20, tileSize: 512, zoomOffset: -1, attribution: esri_attribution
  });
  var lyr_streets = L.tileLayer(mapbox_url, {
    id: 'mapbox/streets-v11', maxZoom: 28, tileSize: 512, zoomOffset: -1, attribution: mapbox_attribution
  });

  // --- Popup UI content (dummy data for test) ---
  var popupContent = `
    <div class="popup-chart">
      <h6>China</h6>
      <p>2015</p>
      <div class="value">1.94 million ha</div>
      <div class="subtitle">hectares per year</div>
      <canvas id="chartCanvas" width="200" height="80" style="margin-top:6px;"></canvas>
    </div>
  `;

  // --- Marker + Popup ---
  var marker = L.marker([54.17747885048963, -6.337641477584839], { draggable: false })
                .bindPopup(popupContent);
  var lg_markers = L.layerGroup([marker]);

  // --- Map setup ---
  var map = L.map('map', {
    center: [54.17747885048963, -6.337641477584839],
    zoom: 18,
    layers: [lyr_satellite, lyr_streets, lg_markers]
  });

  var baseMaps = { "Streets": lyr_streets, "Satellite": lyr_satellite };
  var overlayMaps = { "Markers": lg_markers };
  L.control.layers(baseMaps, overlayMaps).addTo(map);

  // --- GeoJSON polygon ---
  var geojsonFeature = {
    "type": "FeatureCollection",
    "features": [{
      "type": "Feature",
      "properties": {},
      "geometry": {
        "type": "Polygon",
        "coordinates": [[
          [-6.337939202785492, 54.17750946223595],
          [-6.337791681289673, 54.17731401762],
          [-6.337337046861649, 54.17743489512197],
          [-6.337392032146454, 54.177507107487024],
          [-6.337371915578842, 54.17751652648189],
          [-6.337402760982513, 54.17755734210142],
          [-6.337433606386185, 54.177550277862466],
          [-6.337492614984512, 54.1776334788225],
          [-6.337939202785492, 54.17750946223595]
        ]]
      }
    }]
  };
  L.geoJSON(geojsonFeature).addTo(map);

  // --- Draw small dummy chart when popup opens ---
  map.on('popupopen', function () {
    var canvas = document.getElementById('chartCanvas');
    if (canvas) {
      var ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.beginPath();
      ctx.moveTo(10, 60);
      ctx.lineTo(80, 20);
      ctx.lineTo(190, 60);
      ctx.strokeStyle = '#1a936f';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#1a936f';
      ctx.beginPath();
      ctx.arc(190, 60, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = '10px Arial';
      ctx.fillStyle = '#777';
      ctx.fillText('1990', 8, 75);
      ctx.fillText('2015', 175, 75);
    }
  });
</script>
</body>
</html>
