<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaflet GeoJSON Zones</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.6.0/dist/leaflet.css" />

<style>
  #map { height: 400px; }
  .popup-chart {
    font-family: Arial, sans-serif;
    width: 230px;
  }
  .popup-chart h6 {
    margin: 0;
    font-weight: bold;
  }
  .popup-chart p {
    margin: 0;
    color: #555;
  }
  .popup-chart .value {
    margin-top: 4px;
    font-size: 18px;
    font-weight: bold;
    color: #1a936f;
  }
  .popup-chart .subtitle {
    font-size: 11px;
    color: #777;
  }
</style>
</head>

<body>
<nav class="navbar navbar-expand-sm navbar-dark bg-dark">
  <div class="container-fluid">
    <a href="#" class="navbar-brand">Leaflet Zones Demo</a>
  </div>
</nav>

<main>
  <section class="py-4 container">
    <h1 class="fw-light text-center">Peta Deforestasi Lahan Tambang (Zone 1–3)</h1>
    <div id="map" class="mt-4"></div>
  </section>
</main>

<footer class="text-muted py-5">
  <div class="container text-center">
    <p>Example with 3 zones generated randomly near Newry Town Hall</p>
  </div>
</footer>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1/dist/js/bootstrap.min.js"></script>
<script src="https://unpkg.com/leaflet@1.6.0/dist/leaflet.js"></script>

<script>
// === Base Layers ===
const mapbox_url = 'https://api.mapbox.com/styles/v1/{id}/tiles/{z}/{x}/{y}?access_token=pk.eyJ1Ijoiam9ubnltY2N1bGxhZ2giLCJhIjoiY2xsYzdveWh4MGhwcjN0cXV5Z3BwMXA1dCJ9.QoEHzPNq9DtTRrdtXfOdrw';
const esri_url = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';

const lyr_satellite = L.tileLayer(esri_url, {maxZoom: 20, attribution: '© Esri'});
const lyr_streets = L.tileLayer(mapbox_url, {id: 'mapbox/streets-v11', maxZoom: 20, attribution: '© Mapbox © OpenStreetMap'});

// === Popup UI ===
const popupContent = `
  <div class="popup-chart">
    <h6>China</h6>
    <p>2015</p>
    <div class="value">1.94 million ha</div>
    <div class="subtitle">hectares per year</div>
    <canvas id="chartCanvas" width="200" height="80" style="margin-top:6px;"></canvas>
  </div>
`;

// === Marker ===
const marker = L.marker([54.17747885048963, -6.337641477584839]).bindPopup(popupContent);
const lg_markers = L.layerGroup([marker]);

// === Map Init ===
const map = L.map('map', {
  center: [54.17747885048963, -6.337641477584839],
  zoom: 18,
  layers: [lyr_satellite, lg_markers]
});

const baseMaps = {"Streets": lyr_streets, "Satellite": lyr_satellite};
const overlayMaps = {"Markers": lg_markers};
L.control.layers(baseMaps, overlayMaps).addTo(map);

// === Original Zone 1 Polygon ===
const basePolygon = [
  [-6.337939202785492, 54.17750946223595],
  [-6.337791681289673, 54.17731401762],
  [-6.337337046861649, 54.17743489512197],
  [-6.337392032146454, 54.177507107487024],
  [-6.337371915578842, 54.17751652648189],
  [-6.337402760982513, 54.17755734210142],
  [-6.337433606386185, 54.177550277862466],
  [-6.337492614984512, 54.1776334788225],
  [-6.337939202785492, 54.17750946223595]
];

// === Utility: Slightly offset coordinates to make new random zones ===
function offsetCoords(coords, offsetScale) {
  return coords.map(([lng, lat]) => {
    const offsetLng = lng + (Math.random() - 0.5) * offsetScale;
    const offsetLat = lat + (Math.random() - 0.5) * offsetScale;
    return [offsetLng, offsetLat];
  });
}

// === Create Zone 1, 2, 3 ===
const zones = [
  {name: "Zone 1", coords: basePolygon, color: "#28a745"},
  {name: "Zone 2", coords: offsetCoords(basePolygon, 0.0003), color: "#007bff"},
  {name: "Zone 3", coords: offsetCoords(basePolygon, 0.0005), color: "#ffc107"}
];

// === Add to map ===
zones.forEach(zone => {
  L.geoJSON({
    "type": "Feature",
    "geometry": {
      "type": "Polygon",
      "coordinates": [zone.coords]
    },
    "properties": {"name": zone.name}
  }, {
    style: {
      color: zone.color,
      weight: 2,
      fillOpacity: 0.3
    }
  }).bindTooltip(zone.name, {permanent: false, direction: "top"}).addTo(map);
});

// === Draw simple chart on popup open ===
map.on('popupopen', () => {
  const canvas = document.getElementById('chartCanvas');
  if (canvas) {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.beginPath();
    ctx.moveTo(10, 60);
    ctx.lineTo(80, 20);
    ctx.lineTo(190, 60);
    ctx.strokeStyle = '#1a936f';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#1a936f';
    ctx.beginPath();
    ctx.arc(190, 60, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.font = '10px Arial';
    ctx.fillStyle = '#777';
    ctx.fillText('1990', 8, 75);
    ctx.fillText('2015', 175, 75);
  }
});
</script>
</body>
</html>
